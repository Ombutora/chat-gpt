# Tora AI web theme ("tora" is Japanese for tiger): warm charcoal with a tiger-orange accent.
# tora-web loads this with --theme.base. Streamlit's settings menu switches light and dark.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap, monospace"
baseRadius = "large"
buttonRadius = "full"
showSidebarBorder = true
linkUnderline = false

[theme.dark]
primaryColor = "#F7931E"
backgroundColor = "#14110F"
secondaryBackgroundColor = "#1F1A16"
textColor = "#F3EDE6"
linkColor = "#FFB454"
borderColor = "#2E2721"
codeBackgroundColor = "#1A1613"

[theme.dark.sidebar]
backgroundColor = "#0E0C0A"
secondaryBackgroundColor = "#1F1A16"

[theme.light]
primaryColor = "#D9730D"
backgroundColor = "#FFFAF4"
secondaryBackgroundColor = "#F6EBDD"
textColor = "#2A211A"
linkColor = "#B85C00"
borderColor = "#EADBC8"
codeBackgroundColor = "#F6EBDD"

[theme.light.sidebar]
backgroundColor = "#FBF1E4"
secondaryBackgroundColor = "#F1E2CF"
