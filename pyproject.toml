[project]
name = "tora-ai"
description = "Tora AI: a chat assistant powered by gpt-oss models through hosted, OpenAI-compatible APIs"
version = "0.1.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ombutora" }]
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "lxml>=4.9.4",
  "html2text>=2024.2.26",
  "rich>=13.7",
]

[project.optional-dependencies]
web = ["streamlit>=1.50"]
python = ["docker>=7.1.0"]
test = ["pytest>=8.0"]

[project.scripts]
tora = "tora_ai.cli:main"
tora-web = "tora_ai.web_app:launch"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tora_ai*"]
